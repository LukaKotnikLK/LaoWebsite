<!DOCTYPE html>
<html>
<head>
  <title>Share Page</title>
  <link rel="stylesheet" href="download.css">
</head>
<body>

<div class="container">

  <img src="images/logo_black.png" alt="Center Image" class="center-img">

  <div class="buttons">
    <a class="btn" href="https://example.com/extension-download" target="_blank">
      <img src="images/download.png" alt="Download">
    </a>

    <div class="share-wrapper">
      <button class="btn" id="shareBtn"><img src="images/share.png" alt="Share"></button>

      <div class="share-menu" id="shareMenu">
        <button data-type="x">X (Twitter)</button>
        <button data-type="fb">Facebook</button>
        <button data-type="copy">Copy Text</button>
      </div>
    </div>
  </div>

</div>

<script src="download.js"></script>
</body>
</html>
